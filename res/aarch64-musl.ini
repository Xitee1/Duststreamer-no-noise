[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
needs_exe_wrapper = false

[binaries]
c = 'aarch64-cc'
cpp = 'aarch64-cxx'
ar = 'llvm-ar'
nm = 'llvm-nm'
strip = 'llvm-strip'
ranlib = 'llvm-ranlib'
pkgconfig = 'pkg-config'
readelf = 'llvm-readelf'
objcopy = 'llvm-objcopy'
